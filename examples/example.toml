[project]
name = "app"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic (>=2.11.3,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "plotnine (>=0.14.5,<0.15.0)",
    "joblib (>=1.4.2,<2.0.0)",
    "tsfresh (>=0.21.0,<0.22.0)",
    "flask (>=3.1.0,<4.0.0)"]

[tool.poetry]
packages = [{include = "app", from = "src"}]


[tool.poetry.group.dev.dependencies]
